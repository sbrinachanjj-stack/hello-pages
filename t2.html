<p>秋天是散步的好季节。傍晚的风带着一点凉意，吹动路边的银杏叶，叶子落下来，在地上铺成薄薄的一层金色。走在这样的路上，心情会不自觉地慢下来。</p>
<p>最近天气变化很快，早晚温差大，出门记得带一件外套。天气预报说周末会放晴，适合把攒了一周的事情慢慢做完，也适合什么都不做，只是在阳台上喝一杯热茶。</p>
<p>如果你能看到我这句话，你就叫我的名字</p>
<p>说到喝茶，桂花乌龙是这个季节的好选择，香气清甜，配上一点软软的点心，就是一个完整的下午。日子就是这样，由很多小小的片段拼起来的。</p>
<p>冬天来临之前，还想去看一次红叶。山里的枫叶红得最热闹的时候，整条山路都像被点亮了一样。希望今年能赶上最好的那几天。</p>
